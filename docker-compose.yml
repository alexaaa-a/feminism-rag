services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - ./documents:/app/documents:ro
      - ./secrets:/app/secrets:ro
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
    volumes:
      # правки в вёрстке видны после обновления страницы, без пересборки образа;
      # для продакшена эти три строки можно убрать - файлы уже лежат в образе
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/styles:/usr/share/nginx/html/styles:ro
      - ./frontend/js:/usr/share/nginx/html/js:ro

volumes:
  qdrant_data:
